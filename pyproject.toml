[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtree-scratch"
version = "0.1.0"
description = "Dependency-free CART decision trees and random forests, from scratch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arnav Chawla" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dtree = "dtree_scratch.cli:main"

[tool.setuptools.packages.find]
include = ["dtree_scratch*"]
